[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd35-spellbook"
version = "0.1.0"
description = "Local-first D&D 3.5 printable spellbook builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "reportlab>=4.2,<5",
  "requests>=2.32,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
spellbook = "spellbook_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spellbook_builder = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: live network integration tests (excluded from normal test run)"]
